name: CD

on:
  push:
    branches: [deployment]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      app_image: ${{ steps.build-app.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: "431445718054"

      - name: Build and push app image
        id: build-app
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE=$REGISTRY/doc-parser/app:${{ github.sha }}
          docker build -t $IMAGE .
          docker tag $IMAGE $REGISTRY/doc-parser/app:latest
          docker push $IMAGE
          docker push $REGISTRY/doc-parser/app:latest
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check ALB availability
        id: alb-check
        run: |
          ALB_STATE=$(aws elbv2 describe-load-balancers \
            --names doc-parser-alb \
            --query 'LoadBalancers[0].State.Code' \
            --output text 2>/dev/null || echo "MISSING")
          echo "alb_state=$ALB_STATE" >> $GITHUB_OUTPUT
          if [ "$ALB_STATE" != "active" ]; then
            echo "::warning::ALB not found or not active (state=$ALB_STATE). Skipping deployment — recreate the ALB to resume live deployments."
          fi

      - name: Register task definition
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://app-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Create or update ECS service
        if: steps.alb-check.outputs.alb_state == 'active'
        run: |
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.ECS_SERVICE_APP }} \
            --query 'services[0].status' \
            --output text 2>/dev/null || echo "MISSING")

          if [ "$SERVICE_STATUS" = "ACTIVE" ]; then
            echo "Service exists — forcing new deployment..."
            aws ecs update-service \
              --cluster ${{ secrets.ECS_CLUSTER }} \
              --service ${{ secrets.ECS_SERVICE_APP }} \
              --task-definition ${{ steps.register-task-def.outputs.task_def_arn }} \
              --force-new-deployment
          else
            echo "Service not found — creating..."
            aws ecs create-service \
              --cluster ${{ secrets.ECS_CLUSTER }} \
              --service-name ${{ secrets.ECS_SERVICE_APP }} \
              --task-definition ${{ steps.register-task-def.outputs.task_def_arn }} \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.SUBNET_IDS }}],securityGroups=[${{ secrets.SECURITY_GROUP_IDS }}],assignPublicIp=ENABLED}" \
              --load-balancers "targetGroupArn=${{ secrets.TARGET_GROUP_ARN }},containerName=app,containerPort=8000" \
              --health-check-grace-period-seconds 120
          fi

      - name: Wait for service stable
        if: steps.alb-check.outputs.alb_state == 'active'
        run: |
          echo "Polling ECS service stability (max 15 min)..."
          for i in $(seq 1 60); do
            RUNNING=$(aws ecs describe-services \
              --cluster ${{ secrets.ECS_CLUSTER }} \
              --services ${{ secrets.ECS_SERVICE_APP }} \
              --query 'services[0].runningCount' --output text)
            DESIRED=$(aws ecs describe-services \
              --cluster ${{ secrets.ECS_CLUSTER }} \
              --services ${{ secrets.ECS_SERVICE_APP }} \
              --query 'services[0].desiredCount' --output text)
            PENDING=$(aws ecs describe-services \
              --cluster ${{ secrets.ECS_CLUSTER }} \
              --services ${{ secrets.ECS_SERVICE_APP }} \
              --query 'services[0].pendingCount' --output text)
            echo "Attempt $i/60 — running=$RUNNING desired=$DESIRED pending=$PENDING"
            if [ "$RUNNING" = "$DESIRED" ] && [ "$PENDING" = "0" ]; then
              echo "Service is stable."
              exit 0
            fi
            sleep 15
          done
          echo "Service did not stabilize within 15 minutes."
          exit 1

      - name: Wait for ALB target healthy
        if: steps.alb-check.outputs.alb_state == 'active'
        run: |
          echo "Waiting for ALB target to become healthy (max 5 min)..."
          for i in $(seq 1 20); do
            STATE=$(aws elbv2 describe-target-health \
              --target-group-arn ${{ secrets.TARGET_GROUP_ARN }} \
              --query 'TargetHealthDescriptions[?TargetHealth.State==`healthy`] | length(@)' \
              --output text)
            echo "Attempt $i/20 — healthy targets: $STATE"
            if [ "$STATE" -ge "1" ] 2>/dev/null; then
              echo "ALB target is healthy."
              break
            fi
            sleep 15
          done

      - name: Smoke test
        if: steps.alb-check.outputs.alb_state == 'active'
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names doc-parser-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "Testing http://$ALB_DNS/health"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$ALB_DNS/health")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after 10 attempts"
          exit 1
